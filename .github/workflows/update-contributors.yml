name: Update Core App Contributors Data

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows you to force run it from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docs Repository
        uses: actions/checkout@v4

      - name: Fetch and Filter Contributors
        run: |
          mkdir -p _data
          curl -s "https://api.github.com/repos/aisleron/aisleron/contributors" \
          | jq '[.[] | select(.type == "User") | {login: .login, avatar_url: .avatar_url, html_url: .html_url}]' \
          > _data/contributors.json

      - name: Fetch and Filter Sponsors
        env:
          GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }} 
        run: |
          mkdir -p _data
          
          # Added '?' operators to the jq chain to silently handle null responses gracefully
          curl -s -H "Authorization: bearer $GITHUB_TOKEN" \
          -X POST -d '{"query": "query { repositoryOwner(login: \"aisleron\") { ... on User { sponsorshipsAsMaintainer(first: 100, activeOnly: true) { nodes { sponsorEntity { ... on User { login avatarUrl htmlUrl } ... on Organization { login avatarUrl htmlUrl } } } } } ... on Organization { sponsorshipsAsMaintainer(first: 100, activeOnly: true) { nodes { sponsorEntity { ... on User { login avatarUrl htmlUrl } ... on Organization { login avatarUrl htmlUrl } } } } } } }"}' \
          "https://api.github.com/graphql" \
          | jq '[.data?.repositoryOwner?.sponsorshipsAsMaintainer?.nodes[]? | select(.sponsorEntity != null) | {login: .sponsorEntity.login, avatar_url: .sponsorEntity.avatarUrl, html_url: .sponsorEntity.htmlUrl}]' \
          > _data/sponsors.json

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/contributors.json _data/sponsors.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync contributors and sponsors profile details [skip ci]"
            git push
          else
            echo "No profile updates detected."
          fi
