name: Update Core App Contributors Data

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows you to force run it from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docs Repository
        uses: actions/checkout@v4

      - name: Fetch and Filter Contributors Data
        run: |
          mkdir -p _data
          # Fetch from API, pipe through jq to extract only relevant fields, and save
          curl -s "https://api.github.com/repos/aisleron/aisleron/contributors" \
          | jq '[.[] | {login: .login, avatar_url: .avatar_url, html_url: .html_url, type: .type}]' \
          > _data/contributors.json

      - name: Commit and Push to Docs Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/contributors.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync main app contributors [skip ci]"
            git push
          else
            echo "No changes in contributor list."
          fi
